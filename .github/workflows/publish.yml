# Builds the Quarto website and publishes it to GitHub Pages on every push to main.
#
# The R and Python code is NOT re-run here: results are rendered locally and stored in
# _freeze/ (commit that folder). So this workflow needs only Quarto, plus Python's standard
# library for tools/make_starter_kits.py.
#
# One-time setup on GitHub: Settings > Pages > "Build and deployment" > Source: GitHub Actions.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python (for building the starter-kit zips)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the website from frozen results
        run: quarto render

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
